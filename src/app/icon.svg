<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <style>
    /* Tab chrome is not the page. Default to the register's own ground, which
       holds up against a light tab bar; invert for browsers whose chrome is
       dark, so the mark never sinks into whatever is behind it. */
    .tile { fill: #12151b }
    .glyph { fill: #e6e4dd }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #e6e4dd }
      .glyph { fill: #12151b }
    }
  </style>
  <rect class="tile" width="24" height="24" rx="2.5"/>
  <path class="glyph" d="M6 4.5H18V7.75H9.25V10.75H14.75V13.5H9.25V19.5H6Z"/>
  <path class="glyph" fill-opacity="0.45" d="M11.25 17.5H18V19.5H11.25Z"/>
</svg>
