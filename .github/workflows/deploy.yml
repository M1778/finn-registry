name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# A newer push to the same ref makes an in-flight run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Not 20. `wrangler` refuses to start on anything below 22, so on 20 every
  # gate in the Verify job passes and then the Deploy job dies at the first
  # wrangler command — a green build followed by a failed deploy. Found by
  # running the pipeline in Docker on CI's own Node version; see Dockerfile.
  NODE_VERSION: '22'

jobs:
  # Four gates on every push and every pull request, cheapest first. Nothing
  # deploys unless all four pass, and none of them is advisory: there is no
  # `continue-on-error` in this file.
  test:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Fast, and catches most things — but structurally blind to the two gates
      # below: it does not know Next's rules about what a route module may
      # export, and it does not resolve whether a named import actually exists
      # in the module it comes from.
      - name: Typecheck
        run: npm run typecheck

      # `next lint`'s pass, run through the ESLint CLI against the same flat
      # `eslint.config.mjs`. Not `next lint`: that is deprecated in 15.x and
      # removed in 16, and this gate is too load-bearing to fail the day the
      # framework drops it. `import/named` here has caught real runtime breakage
      # that the typecheck cannot see. `tests` is included; the suite is code too.
      - name: Lint
        run: npx eslint src tests --max-warnings=0

      # The production build is its own gate. `tsc --noEmit` was green across
      # this repo for the entire time `next build` was failing, because Next's
      # route-type validation only runs here. It also comes before the tests on
      # purpose: a broken build makes every test failure ambiguous, and this is
      # the faster of the two.
      #
      # This builds the *Worker*, not the Node target, and the difference matters:
      # `next build` was green for a whole afternoon while the Worker bundle could
      # not be produced at all, because esbuild resolves a different set of export
      # conditions than webpack does. Verifying the artifact nobody deploys is not
      # verification. `cf:build` runs `next build` internally, so this is strictly
      # the stronger check and costs no extra time.
      #
      # No APP_URL here, on purpose. The Deploy job passes it because its artifact
      # is the one that ships and `metadataBase` is baked into it; this job's
      # artifact is thrown away, so which origin it built against is irrelevant.
      # Wiring the variable in here would also fail every pull request whenever it
      # is unset, which gates contributions on a repository setting rather than on
      # the code.
      - name: Build worker bundle
        run: npm run cf:build

      - name: Test
        run: npm test

  # Deploy runs only for pushes to master, never for a pull request, and only
  # after `test` is green.
  deploy:
    name: Deploy to Cloudflare Workers
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The origin this deployment answers on has to be known *before* the build,
      # because some of what it feeds cannot be set afterwards.
      #
      # A repository (or environment) variable rather than a secret, deliberately:
      # it is a public URL that ends up in the HTML of every page, and a secret
      # would be masked into `***` in every log line that quoted it, including the
      # failure messages below.
      #
      # This step exists because a missing value is not a build error. `layout.tsx`
      # falls back to `http://localhost:3000` on purpose so `next build` works on a
      # laptop, so with the variable unset nothing downstream complains — the
      # deploy simply ships prerendered pages whose `og:image` and `twitter:image`
      # point at localhost. Failing here is the difference between the owner
      # setting one variable and the owner discovering wrong link previews after
      # the fact.
      #
      # A string check, not a URL parse. `new URL("https://REPLACE_WITH_DEPLOYMENT_ORIGIN")`
      # is a perfectly valid URL and parses without complaint, so parsing would
      # accept the placeholder happily. And the placeholder is the *likely* wrong
      # answer rather than an exotic one: `wrangler.jsonc` ships exactly
      # `https://REPLACE_WITH_DEPLOYMENT_ORIGIN`, so copying it here is the
      # obvious mistake to make.
      - name: Require an origin to build against
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "${APP_URL}" ]; then
            echo "::error::APP_URL is not set, so this deploy would bake http://localhost:3000"
            echo "  into every prerendered page's og:image and twitter:image."
            echo "  Set the repository (or 'production' environment) variable APP_URL to the"
            echo "  origin this deployment answers on, e.g. https://finn-registry.example.workers.dev"
            exit 1
          fi
          if printf '%s' "${APP_URL}" | grep -qiE 'REPLACE[_-]WITH'; then
            echo "::error::APP_URL is still the placeholder: ${APP_URL}"
            echo "  wrangler.jsonc ships https://REPLACE_WITH_DEPLOYMENT_ORIGIN as a value that"
            echo "  validates but is not an answer. Set APP_URL to the real origin."
            exit 1
          fi
          echo "APP_URL = ${APP_URL}"

      # @opennextjs/cloudflare adapts the Next.js build into a Worker. This is a
      # Workers deployment, not Pages, and not `wrangler deploy` over raw
      # source: cf:build produces the worker bundle, cf:deploy ships it.
      #
      # APP_URL is read twice from here, at two different times, and both are
      # correct:
      #
      #   - `src/app/layout.tsx` reads it *now*, during the build, for
      #     `metadataBase`. Open Graph tags are baked into prerendered HTML, so
      #     build time is the only time they can be set. This is the one
      #     legitimate build-time reader of the origin.
      #   - the API router reads it *at runtime*, out of `wrangler.jsonc` `vars`,
      #     to build the OAuth `redirect_uri`. Setting it here does not change
      #     that and does not re-freeze it: Next inlines only `NEXT_PUBLIC_`-
      #     prefixed variables, so `process.env.APP_URL` in the router survives
      #     into the artifact as a lookup. `docker/check-frozen-origin.mjs` is the
      #     assertion that keeps it a lookup.
      #
      # NEXT_PUBLIC_APP_URL is deliberately *not* passed. It would also satisfy
      # `metadataBase`, and it is the wrong habit to build: its build-time
      # inlining is what froze the OAuth callback origin into the artifact once
      # already.
      - name: Build worker bundle
        run: npm run cf:build
        env:
          APP_URL: ${{ vars.APP_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Before the deploy, not after: the new code assumes its schema exists, so
      # a Worker that ships first is a Worker that 500s on every request until
      # this finishes. D1 migrations here are additive, and wrangler tracks
      # which have been applied, so re-running this is a no-op rather than a
      # risk. If a migration is ever written that drops or rewrites a column,
      # this ordering stops being safe and the deploy has to be split in two.
      - name: Apply database migrations
        run: npm run db:apply
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy worker
        run: npm run cf:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
